    <!-- Favicon = isotipo recortado del logo oficial (public/logo.png).
         Google pide un icono cuadrado de minimo 48px para los resultados de busqueda. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      Title, meta description, robots, canonical, og:* y twitter:* NO van aqui
      hardcodeados — cada pagina los define via <SEOHead> (react-helmet-async).
      Tenerlos duplicados en ambos lugares generaba title/meta repetidos en el
      HTML final (visible recien al implementar el prerenderizado, ver
      scripts/prerender.mjs). Este documento base solo lleva lo que NO varia
      por pagina.
    -->
    <meta name="google-site-verification" content="EJ3YV1p3eNy0qNCbbow4gRaZesrPvAVJZuQfGb59MYM" />

    <!-- Fuente alojada en el propio sitio (ver @font-face en src/index.css).
         Se precarga solo el subconjunto latin, que cubre todo el espanol. -->
    <link rel="preload" href="/fonts/plus-jakarta-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!--
      GA4 diferido hasta la primera interaccion real del usuario
      (scroll/click/touch/tecla) o, como respaldo, a los 5s de inactividad
      -- asi no compiten por CPU/red con el contenido inicial. PageSpeed
      marcaba esto como "381 KiB de JS sin usar" (los ~572 KiB de GTM/GA4
      se parsean pero casi nada se ejecuta durante la carga). No pierde
      datos de visitas: sigue cargando igual, solo un poco despues.

      GTM (GTM-T64T3XTF) se quito el 2026-10-20: el contenedor estaba vacio
      (sin etiquetas) y solo sumaba JS sin usar. GA4 se carga directo con
      gtag. Si algun dia se usa GTM, volver a agregar su snippet aca.
    -->
    <script>
      (function () {
        var loaded = false
        function loadAnalytics() {
          if (loaded) return
          loaded = true
          var gaScript = document.createElement('script')
          gaScript.async = true
          gaScript.src = 'https://www.googletagmanager.com/gtag/js?id=G-EVVYDENNHQ'
          document.head.appendChild(gaScript)
          window.dataLayer = window.dataLayer || []
          function gtag() {
            dataLayer.push(arguments)
          }
          window.gtag = gtag
          gtag('js', new Date())
          gtag('config', 'G-EVVYDENNHQ')

          events.forEach(function (ev) {
            window.removeEventListener(ev, loadAnalytics, { passive: true })
          })
          clearTimeout(fallback)
        }
        var events = ['scroll', 'click', 'touchstart', 'mousemove', 'keydown']
        events.forEach(function (ev) {
          window.addEventListener(ev, loadAnalytics, { passive: true, once: true })
        })
        var fallback = setTimeout(loadAnalytics, 5000)
      })()
    </script>
  </body>
</html>
